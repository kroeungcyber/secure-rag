[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-rag"
version = "0.1.0"
description = "RAG document Q&A service for civil society organizations — offline-capable, denied-by-default, fully containerized."
requires-python = ">=3.9"
dependencies = [
    "pypdf>=4.0",
    "python-docx>=1.1",
    "markdownify>=0.12",
    "httpx>=0.27",
    "sqlite-vec>=0.1",
    "ollama>=0.3",
    "pysqlite3>=0.5",
    "tomli>=2.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "typer>=0.12",
    "rich>=13.0",
    "tomli-w>=1.0",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.0", "mypy>=1.0", "flake8>=7.0", "pyyaml>=6.0"]

[project.scripts]
srag = "srag.cli:app"

[tool.setuptools.packages.find]
include = ["srag*"]

[tool.setuptools.package-data]
"srag.api.web" = ["static/*", "templates/*"]

[[tool.mypy.overrides]]
module = ["pysqlite3.*", "sqlite_vec"]
ignore_missing_imports = true
